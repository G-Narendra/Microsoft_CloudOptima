# CloudOptima tool execution governance policy (Agent Governance Toolkit)
apiVersion: governance.toolkit/v1
version: "1.0"
name: cloudoptima-tools
description: "Read-only lookups allowed; state mutations and destructive actions denied."
agents: ["*"]
default_action: deny
rules:
  - name: allow-read-only-lookups
    description: "Read-only metadata and price lookup tools are permitted."
    stage: pre_tool
    condition: "action.type in ['get_live_price', 'compliance_lookup', 'list_regions']"
    action: allow
  - name: deny-email-send
    description: "External communication and notification actions are restricted."
    stage: pre_tool
    condition: "action.type == 'send_email'"
    action: deny
  - name: deny-write-actions
    description: "State-mutating and deployment actions are restricted in evaluation mode."
    stage: pre_tool
    condition: "action.type in ['deploy', 'create', 'delete', 'drop', 'shell']"
    action: deny
