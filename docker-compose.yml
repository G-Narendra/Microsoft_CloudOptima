version: '3.8'

services:
  web:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=live
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - redis
      - jaeger
    volumes:
      - .:/app

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"

volumes:
  redis_data:
