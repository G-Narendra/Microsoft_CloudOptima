[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudoptima"
version = "0.1.0"
description = "Multi-agent AI system that designs cloud architectures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["cloud", "architecture", "multi-agent", "azure", "ai"]

dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.35,<2.0",
    "openai>=1.30,<2.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["cloudoptima/tests"]
addopts = "-v --cov=cloudoptima --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["cloudoptima"]
omit = ["*/tests/*"]

[tool.setuptools.packages.find]
include = ["cloudoptima*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
