[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudoptima"
version = "0.1.0"
description = "Multi-agent AI system that designs cloud architectures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["cloud", "architecture", "multi-agent", "azure", "ai"]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.35,<2.0",
    "openai>=1.30,<2.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15.0,<2.0",
    "azure-keyvault-secrets>=4.8.0,<5.0",
    "azure-search-documents>=11.4.0b8,<12.0",
    "azure-monitor-opentelemetry>=1.4.0,<2.0",
]
rag = [
    "chromadb>=0.5,<1.0",
]
safety = [
    "azure-ai-contentsafety>=1.0,<2.0",
]
mcp = [
    "mcp[cli]>=2.0,<3.0",
]
evaluation = [
    "azure-ai-evaluation>=1.0,<2.0",
]
redteam = [
    "pyrit>=0.7,<1.0",
]
governance = [
    "agent-governance-toolkit>=4.1,<5.0",
    "agent-governance-toolkit-core>=4.1,<5.0",
]
redis = [
    "redis>=5.0,<7.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"cloudoptima/tests/*" = ["S101"]
"cloudoptima/agents/__init__.py" = ["F401"]  # TYPE_CHECKING forward imports for Phases 4-5

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"  # matches the dev venv; numpy stubs require a 3.12 target
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["cloudoptima/tests"]
addopts = "-v --cov=cloudoptima --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["cloudoptima"]
omit = ["*/tests/*"]

[tool.setuptools.packages.find]
include = ["cloudoptima*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
