# CloudOptima CI/CD pipeline.
# Runs quality gates and integration tests.

name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: cloudoptima-app   # created in Phase 13

jobs:
  quality:
    name: Lint · typecheck · test · red-team
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (incl. responsible-AI extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation,redteam,governance,mcp,safety,rag]"

      - name: Ruff lint
        run: ruff check cloudoptima/ scripts/

      - name: Mypy typecheck
        run: mypy cloudoptima/

      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r cloudoptima/ scripts/ -ll

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python"

      - name: Pip-audit
        run: |
          pip install pip-audit
          pip-audit

      - name: Pytest + coverage gate
        run: pytest

      - name: Deterministic red-team gate (0% ASR allowed)
        run: python scripts/redteam/redteam_cloudoptima.py --strict

      - name: PyRIT campaign (offline tier, hermetic)
        run: python scripts/redteam/pyrit_redteam.py --strict

      - name: Evaluation harness (offline F1/Rouge tier)
        run: python scripts/evaluate/run_evaluation.py

      - name: AGT policy lint
        run: agt lint-policy cloudoptima/policies/

      - name: MCP round-trip smoke
        run: python -c "
          from cloudoptima.config import Settings;
          from cloudoptima.mcp_bridge import MCPBridge;
          b = MCPBridge(Settings(mcp_enabled=True));
          r = b.call_tool('list_regions', {});
          assert r['ok'] is True, r;
          print('MCP round-trip OK:', r['source'])"

      - name: Upload evaluation metrics artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-metrics
          path: scripts/evaluate/results/latest_eval.json
          retention-days: 14

      - name: Build Docker Image for Trivy
        run: docker build -t cloudoptima:ci .
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudoptima:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-compose-test:
    name: Local Docker Compose Integration
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Start services
        run: docker compose up -d
        
      - name: Wait for services
        run: sleep 15
        
      - name: Verify containers are running
        run: docker compose ps | grep Up
        
      - name: Tear down
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Azure App Service
    needs: docker-compose-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
